name: Daily snapshot

on:
  schedule:
    # Pre-market daily baseline: 12:00 UTC ≈ 07:00 ET (EST) / 08:00 (EDT).
    - cron: "0 12 * * *"
    # Hourly during/after US market hours, weekdays. GitHub cron is UTC-only:
    # 13:35-21:35 UTC ≈ 09:35-17:35 ET during EDT (one hour earlier in EST —
    # still inside the trading day, so no DST edit needed).
    - cron: "35 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build snapshot
        run: python snapshot.py
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.parquet report.xlsx
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: refresh daily snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
